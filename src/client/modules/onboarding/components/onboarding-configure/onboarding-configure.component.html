<section class="configure-card orc-low-card">
	<h2>{{ descriptors[configuration().service].name }}</h2>
	<p>{{ copy[configuration().service].configure }}</p>
	<orc-service-connection
		[configuration]="configuration()"
		[pending]="pending()"
		context="onboarding"
		(checked)="checked.emit($event)"
		(applied)="applied.emit($event.check)"
		(backed)="backed.emit()"
		(skipped)="skipped.emit()"
	></orc-service-connection>
</section>
