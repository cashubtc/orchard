<section class="configure-card" [attr.aria-labelledby]="'onboarding-configure-' + configuration().service">
	<orc-service-connection
		[configuration]="configuration()"
		[pending]="pending()"
		context="onboarding"
		(checked)="checked.emit($event)"
		(applied)="applied.emit($event.check)"
		(backed)="backed.emit()"
		(skipped)="skipped.emit()"
	>
		<div connection-heading class="configure-heading">
			<h2 [id]="'onboarding-configure-' + configuration().service">{{ descriptors[configuration().service].name }}</h2>
			<p>{{ copy[configuration().service].configure }}</p>
		</div>
	</orc-service-connection>
</section>
