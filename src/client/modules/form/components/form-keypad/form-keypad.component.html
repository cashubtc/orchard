<div class="form-keypad">
	@for (key_name of keys(); track key_name) {
		<button
			type="button"
			class="form-keypad-key orc-high-card"
			[class.form-keypad-zero]="key_name === '0'"
			matRipple
			[attr.aria-label]="key_name === 'backspace' ? 'Delete' : key_name === '.' ? 'Decimal point' : null"
			(click)="key.emit(key_name)"
		>
			@if (key_name === 'backspace') {
				<mat-icon>backspace</mat-icon>
			} @else {
				{{ key_name }}
			}
		</button>
	}
</div>
