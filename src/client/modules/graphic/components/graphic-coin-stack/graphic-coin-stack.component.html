<div class="stack" [class]="unit_class()">
	@for (layer of layers(); track layer) {
		<div class="coin-layer" [class.coin-layer-leave]="!$last" [style.--coin-count]="coin_count()" (animationend)="onLeft($event)">
			@for (groups of layer; track $index) {
				<div class="coin-row">
					@for (coins of groups; track $index) {
						<div class="coin-group" [style.--group-x]="$index - (groups.length - 1) / 2">
							@for (order of coins; track $index) {
								<div class="coin" [style.--drop-order]="order"></div>
							}
						</div>
					}
				</div>
			}
		</div>
	}
</div>
