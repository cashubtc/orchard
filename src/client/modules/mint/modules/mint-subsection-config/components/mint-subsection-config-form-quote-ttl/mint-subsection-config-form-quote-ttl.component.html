<div class="p-r-1 p-b-2" [ngClass]="{'p-l-1': !device_desktop(), 'p-l-2': device_desktop()}">
	<mat-card appearance="outlined" class="relative overflow-hidden">
		<mat-card-content class="orc-surface-container-low-bg">
			<div class="flex flex-gap-column-2 flex-wrap-reverse">
				<div class="flex-1 flex flex-column flex-gap-2 p-l-1">
					<div class="flex flex-column">
						@if (member()) {
							<p class="m-0 font-size-xs">This member only. Not visible to the other members.</p>
						}
						<form
							class="flex-grow"
							[formGroup]="form_group()"
							(ngSubmit)="onSubmit($event)"
							(keydown.enter)="onSubmit($event)"
							(keydown.escape)="onCancel($event)"
						>
							<orc-form-field-dynamic
								[hot]="form_hot()"
								[invalid]="control_invalid() ?? false"
								[info]="true"
								(submit)="onSubmit($event)"
								(cancel)="onCancel($event)"
								(inform)="help_status.set(!help_status())"
							>
								<div class="orc-small-form-field-wrapper">
									<mat-form-field
										appearance="fill"
										hideRequiredMarker="true"
										[ngClass]="form_hot() ? 'orc-hot-form-field' : 'orc-cold-form-field'"
										class="w-full orc-dynamic-form-field"
									>
										<mat-label>{{ nut() === 'nut4' ? 'Mint' : 'Melt' }} quote expiry</mat-label>
										<input
											type="text"
											formNumberSeparator
											matInput
											[formControlName]="control_name()"
											(focus)="onFocus()"
											(blur)="onBlur()"
											[placeholder]="placeholder()"
											#element_quote_ttl
										/>
										<span matSuffix class="form-suffix-text">{{ device_desktop() ? 'seconds' : 's' }}</span>
										<mat-hint class="font-size-xs orc-outline-color">
											<orc-mint-subsection-config-form-quote-ttl-hint
												[quote_ttl]="form_group().get(control_name())?.value"
											></orc-mint-subsection-config-form-quote-ttl-hint>
										</mat-hint>
										<mat-error>
											<orc-form-error [errors]="form_group().get(control_name())?.errors"
												>Invalid expiry</orc-form-error
											>
										</mat-error>
									</mat-form-field>
								</div>
							</orc-form-field-dynamic>
						</form>
						<div class="orc-animation-expand-collapse" [class.animation-expanded]="help_status()">
							<div class="orc-animation-expand-collapse-inner">
								<div class="flex p-t-0-5">
									<orc-form-help-text class="orc-surface-container-high-bg">
										<div [innerHTML]="help_text()"></div>
									</orc-form-help-text>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="flex-1 flex flex-column flex-gap-0-5">
					<orc-mint-subsection-config-chart-quote-ttl
						[nut]="nut()"
						[loading]="loading()"
						[quotes]="valid_quotes()"
						[locale]="locale()"
						[form_hot]="form_hot()"
						[quote_ttl]="form_group().get(control_name())?.value"
						[deltas]="stat_deltas()"
						[stats]="stats()"
					>
						<orc-mint-subsection-config-stats
							[loading]="loading()"
							[stats]="stats()"
							[unit]="'s'"
						></orc-mint-subsection-config-stats>
					</orc-mint-subsection-config-chart-quote-ttl>
				</div>
			</div>
			@if (disabled()) {
				<div class="disabled-overlay" animate.enter="orc-animation-fadein-fast" animate.leave="orc-animation-fadeout-fast">
					<div class="orc-outline-color font-weight-bold">MINTING DISABLED</div>
				</div>
			}
		</mat-card-content>
	</mat-card>
</div>
