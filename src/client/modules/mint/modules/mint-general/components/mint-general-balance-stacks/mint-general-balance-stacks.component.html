<div class="mint-balance-stacks-container">
	<div class="stack-container">
		<orc-graphic-coin-stack [unit]="unit()" [value]="assets()" [counterpart]="liabilities()"></orc-graphic-coin-stack>
		@if (solvency() !== null) {
			<div class="orc-outline-color text-nowrap" [class.orc-status-inactive-color]="solvency()! < 1">{{ solvency() }}x</div>
		}
	</div>
	<div class="divider"></div>
	<div class="stack-container">
		<orc-graphic-coin-stack [unit]="unit()" [value]="liabilities()" [counterpart]="assets()"></orc-graphic-coin-stack>
		@if (solvency() !== null) {
			<div class="orc-outline-color text-nowrap invisible">{{ solvency() }}x</div>
		}
	</div>
</div>
