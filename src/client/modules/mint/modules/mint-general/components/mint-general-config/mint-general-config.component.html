<div class="flex flex-column flex-gap-1">
	<div class="title-l">Config</div>
	<mat-card appearance="outlined" class="relative overflow-hidden w-min-24">
		<mat-card-content class="orc-surface-container-low-bg">
			<div class="flex flex-column flex-gap-1">
				<div class="flex flex-column flex-gap-0-5">
					<div class="font-size-xs orc-outline-color">Supported Nuts</div>
					<div class="flex flex-row flex-gap-0-5 flex-wrap">
						@for (nut of nuts(); track nut.number) {
							<div class="nut-card orc-high-card" (click)="onNutClick(nut.number)">
								<orc-graphic-status [status]="nut.status" size="0.5rem"></orc-graphic-status>
								<div class="font-size-xs font-weight-semi-bold">{{ nut.number }}</div>
							</div>
						}
					</div>
				</div>

				<div class="flex flex-column flex-gap-0-25">
					<div class="font-size-xs orc-outline-color">Supported Methods</div>
					<orc-cashu-method-chips [methods]="supported_methods()" [selectable]="false"></orc-cashu-method-chips>
				</div>

				@if (info()?.nuts; as nuts) {
					<orc-cashu-limits [nuts]="nuts"></orc-cashu-limits>
				}
			</div>
		</mat-card-content>
	</mat-card>
</div>
