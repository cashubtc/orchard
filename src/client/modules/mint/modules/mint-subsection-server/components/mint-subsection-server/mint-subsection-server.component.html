<div class="mint-server-container">
	@if (page_settings(); as settings) {
		<div class="mint-server-control-panel p-t-1">
			<div class="flex flex-justify-between flex-gap-1 flex-items-end">
				<orc-mint-subsection-server-control
					class="flex-grow"
					[page_settings]="settings"
					[loading]="loading_metrics()"
					[device_type]="device_type()"
					(dateChange)="onDateChange($event)"
					(presetChange)="onPresetChange($event)"
					(intervalChange)="onIntervalChange($event)"
				></orc-mint-subsection-server-control>
				<div class="p-b-1-5">
					<button
						mat-icon-button
						type="button"
						class="orc-icon-button"
						aria-label="Refresh data"
						[disabled]="refreshing()"
						(click)="onRefresh()"
					>
						<mat-icon [class.refresh-spinning]="refreshing()">refresh</mat-icon>
					</button>
				</div>
			</div>
			<div class="category-rule"></div>
		</div>

		<orc-mint-subsection-server-summary [snapshots]="snapshots()"></orc-mint-subsection-server-summary>

		<div class="grid mint-server-charts">
			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Mint Operations</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="operations_metrics()"
							[interval]="settings.interval"
							unit="count"
							type="bar"
							[stacked]="true"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Operation Latency <small class="orc-outline-color">avg</small></div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="operation_duration_metrics()"
							[interval]="settings.interval"
							unit="seconds"
							type="line"
							[color_index]="1"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">HTTP Requests</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="http_requests_metrics()"
							[interval]="settings.interval"
							unit="count"
							type="bar"
							[stacked]="true"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">HTTP Latency <small class="orc-outline-color">avg</small></div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="http_duration_metrics()"
							[interval]="settings.interval"
							unit="seconds"
							type="line"
							[color_index]="1"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Database Operations</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="db_operations_metrics()"
							[interval]="settings.interval"
							unit="count"
							type="bar"
							[color_index]="3"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Database Latency <small class="orc-outline-color">avg</small></div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="db_duration_metrics()"
							[interval]="settings.interval"
							unit="seconds"
							type="line"
							[color_index]="3"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">CPU Usage</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="cpu_metrics()"
							[interval]="settings.interval"
							unit="percent"
							type="line"
							[color_index]="0"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Memory Usage</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="memory_metrics()"
							[interval]="settings.interval"
							unit="bytes"
							type="line"
							[color_index]="2"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="flex flex-column flex-gap-1">
				<div class="title-m">Errors</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-mint-subsection-server-chart
							[locale]="locale"
							[metrics]="errors_metrics()"
							[interval]="settings.interval"
							unit="count"
							type="bar"
							[color_index]="4"
							[loading]="loading_metrics()"
						></orc-mint-subsection-server-chart>
					</mat-card-content>
				</mat-card>
			</div>
		</div>
	}
</div>
