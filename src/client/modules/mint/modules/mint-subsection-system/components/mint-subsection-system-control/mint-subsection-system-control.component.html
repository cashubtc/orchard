<div class="mint-system-control-panel-container">
	<form [formGroup]="panel" class="panel-form orc-animation-form-reaction" [class.animation-invalid]="height_state === 'invalid'">
		<div class="flex flex-col flex-gap-1">
			<div formGroupName="daterange">
				<mat-form-field hideRequiredMarker="true" subscriptSizing="dynamic" class="big-form-field">
					<mat-label>Date range</mat-label>
					<mat-date-range-input [rangePicker]="picker">
						<input
							matStartDate
							formControlName="date_start"
							placeholder="Start date"
							(blur)="onDateChange()"
							(keyup.enter)="onDateChange()"
						/>
						<input
							matEndDate
							formControlName="date_end"
							placeholder="End date"
							(blur)="onDateChange()"
							(keyup.enter)="onDateChange()"
						/>
					</mat-date-range-input>
					<orc-form-daterange-scroll-picker
						matIconSuffix
						[date_start]="panel.controls.daterange.controls.date_start.value"
						[date_end]="panel.controls.daterange.controls.date_end.value"
						[active_preset]="page_settings().date_preset"
						[device_type]="device_type()"
						(presetChange)="onPresetChange($event)"
						(dateRangeChange)="onDateRangeChange($event)"
						(closed)="onDateChange()"
					></orc-form-daterange-scroll-picker>
					<mat-date-range-picker #picker></mat-date-range-picker>
					<mat-error class="font-size-xs">Invalid date range</mat-error>
				</mat-form-field>
			</div>
			<div>
				<mat-form-field hideRequiredMarker="true" subscriptSizing="dynamic">
					<mat-label>Interval</mat-label>
					<mat-select formControlName="interval" (selectionChange)="onIntervalChange($event)">
						@for (interval of interval_options; track interval.value) {
							<mat-option [value]="interval.value">{{ interval.label }}</mat-option>
						}
					</mat-select>
				</mat-form-field>
			</div>
		</div>
	</form>
</div>
