<div class="service-editor">
	<header class="editor-header">
		<h2>{{ configuration.enabled ? 'Edit' : 'Add' }} {{ descriptor.name }}</h2>
		<button mat-icon-button type="button" aria-label="Close service editor" (click)="close()" [disabled]="busy()">
			<mat-icon>close</mat-icon>
		</button>
	</header>
	<div class="category-rule"></div>
	<div class="editor-content">
		@if (error()) {
			<p role="alert" class="editor-message orc-error-color">{{ error() }}</p>
		}
		@if (removed()) {
			<div class="editor-removed">
				<p role="status">{{ descriptor.name }} removed. No restart needed.</p>
				<orc-service-refresh-alert [service]="configuration.service" [disabled]="busy()"></orc-service-refresh-alert>
				<button matButton="filled" type="button" [disabled]="busy()" (click)="close()">Done</button>
			</div>
		} @else {
			<p class="editor-message">Changes apply as soon as you save. No restart needed.</p>
			<orc-service-connection [configuration]="configuration" [pending]="removing()" (applied)="applied($event)" (done)="close()">
				@if (effective_configuration().enabled) {
					<button
						connection-actions
						matButton
						type="button"
						[attr.aria-label]="'Remove ' + descriptor.name"
						[disabled]="busy()"
						(click)="confirmRemove()"
					>
						Remove {{ descriptor.name }}
					</button>
				}
			</orc-service-connection>
		}
	</div>
</div>
