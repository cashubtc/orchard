<div class="connection-body">
	<!-- A parent's heading scrolls with the form rather than staying pinned above it -->
	<ng-content select="[connection-heading]"></ng-content>
	<orc-service-fields
		[configuration]="configuration()"
		[form]="form"
		[flagged]="result()?.fields ?? []"
		[flag_message]="flag_message()"
		(changed)="changed()"
	></orc-service-fields>
</div>
<div class="connection-foot">
	@if (result(); as check) {
		<orc-service-check-result [result]="check"></orc-service-check-result>
	}
	@if (error()) {
		<p class="orc-error-color" role="alert">{{ error() }}</p>
	}
	@if (saved()) {
		<p role="status" class="orc-status-active-color">
			{{ result()?.ok ? 'Saved and reconnected' : 'Connection saved' }}. No restart needed.
		</p>
	}
	<orc-service-refresh-alert [service]="configuration().service" [disabled]="busy()"></orc-service-refresh-alert>
	<div class="connection-actions">
		<ng-content select="[connection-actions]"></ng-content>
		@if (context() === 'onboarding') {
			<button matButton type="button" [disabled]="busy()" (click)="backed.emit()">Back</button>
			<button matButton type="button" [disabled]="busy()" (click)="skipped.emit()">Skip</button>
		}
		<span class="actions-spacer"></span>
		@if (saved() && context() === 'settings') {
			<button matButton="filled" type="button" [disabled]="busy()" (click)="done.emit()">Done</button>
		} @else {
			<!-- The buttons keep their place and size while a request runs; only the clicked one shows progress -->
			<button matButton="outlined" type="button" [disabled]="busy()" [attr.aria-busy]="testing()" (click)="submit(false)">
				@if (testing()) {
					<mat-progress-spinner
						matButtonIcon
						class="button-spinner"
						mode="indeterminate"
						diameter="18"
						strokeWidth="2"
						aria-hidden="true"
					></mat-progress-spinner>
				} @else {
					<mat-icon>network_check</mat-icon>
				}
				Test connection
			</button>
			<button
				matButton="filled"
				type="button"
				class="save-button"
				[disabled]="busy()"
				[attr.aria-busy]="saving()"
				(click)="submit(true, failed())"
			>
				<!-- The other label is reserved invisibly, so the button keeps the wider width whichever one shows -->
				<span class="save-label" [class.save-label-hidden]="saving()" [attr.data-reserve]="failed() ? save_label() : 'Save anyway'"
					><span>{{ failed() ? 'Save anyway' : save_label() }}</span></span
				>
				@if (saving()) {
					<mat-progress-spinner
						class="button-spinner save-spinner"
						mode="indeterminate"
						diameter="18"
						strokeWidth="2"
						aria-hidden="true"
					></mat-progress-spinner>
				}
			</button>
		}
	</div>
</div>
