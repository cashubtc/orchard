<div class="index-system-container">
	@if (page_settings(); as settings) {
		<div class="index-system-control-panel p-t-1">
			<div class="flex flex-justify-between flex-gap-1 flex-items-end">
				<orc-index-subsection-system-control
					class="flex-grow"
					[page_settings]="settings"
					[loading]="loading_metrics()"
					[device_type]="device_type()"
					(dateChange)="onDateChange($event)"
					(presetChange)="onPresetChange($event)"
					(intervalChange)="onIntervalChange($event)"
				></orc-index-subsection-system-control>
				@if (device_type() === 'desktop') {
					<div class="index-system-uptime p-b-1-5">
						<div class="index-system-uptime-stat">
							<span class="index-system-uptime-label orc-outline-color">System</span>
							<span class="index-system-uptime-value">{{ uptime_system_label() }}</span>
						</div>
						<div class="index-system-uptime-stat">
							<span class="index-system-uptime-label orc-outline-color">Process</span>
							<span class="index-system-uptime-value">{{ uptime_process_label() }}</span>
						</div>
					</div>
				}
				<div class="p-b-1-5">
					<button
						mat-icon-button
						type="button"
						class="orc-icon-button"
						aria-label="Refresh data"
						[disabled]="refreshing()"
						(click)="onRefresh()"
					>
						<mat-icon [class.refresh-spinning]="refreshing()">refresh</mat-icon>
					</button>
				</div>
			</div>
			<div class="category-rule"></div>
		</div>

		<div class="grid index-system-charts">
			<!-- System -->
			<div class="col-6 flex flex-column flex-gap-1">
				<div class="title-m">CPU Usage</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="cpu_metrics()"
							[interval]="settings.interval"
							unit="percent"
							type="line"
							[color_index]="0"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="col-3 flex flex-column flex-gap-1">
				<div class="title-m">Memory Usage</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="memory_rss_metrics()"
							[interval]="settings.interval"
							unit="megabytes"
							type="line"
							[color_index]="2"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="col-3 flex flex-column flex-gap-1">
				<div class="title-m">Memory %</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="memory_percent_metrics()"
							[interval]="settings.interval"
							unit="percent"
							type="line"
							[color_index]="2"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<!-- Host -->
			<div class="col-6 flex flex-column flex-gap-1">
				<div class="title-m">Disk Usage</div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="disk_metrics()"
							[interval]="settings.interval"
							unit="percent"
							type="line"
							[color_index]="4"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<div class="col-6 flex flex-column flex-gap-1">
				<div class="title-m">Load Average <small class="orc-outline-color">runnable processes · 1m · 5m · 15m</small></div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="load_metrics()"
							[interval]="settings.interval"
							unit="count"
							type="line"
							[color_index]="3"
							legend="below"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>

			<!-- App memory (full width) -->
			<div class="col-12 flex flex-column flex-gap-1">
				<div class="title-m">App Memory <small class="orc-outline-color">V8 heap · used vs total</small></div>
				<mat-card appearance="outlined" class="relative overflow-hidden">
					<mat-card-content class="orc-surface-container-low-bg">
						<orc-index-subsection-system-chart
							[locale]="locale"
							[metrics]="heap_metrics()"
							[interval]="settings.interval"
							unit="megabytes"
							type="line"
							[color_index]="1"
							legend="below"
							[loading]="loading_metrics()"
						></orc-index-subsection-system-chart>
					</mat-card-content>
				</mat-card>
			</div>
		</div>
	}
</div>
