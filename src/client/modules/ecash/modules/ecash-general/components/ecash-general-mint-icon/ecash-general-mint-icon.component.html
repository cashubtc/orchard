@switch (icon_state()) {
	@case ('loading') {
		<mat-spinner diameter="20" aria-label="Loading mint icon"></mat-spinner>
	}
	@case ('loaded') {
		<img class="w-full h-full" [src]="icon_data()" [alt]="name()" (error)="onIconError()" />
	}
	@default {
		<span class="font-size-s font-weight-semi-bold">{{ initials() }}</span>
	}
}
