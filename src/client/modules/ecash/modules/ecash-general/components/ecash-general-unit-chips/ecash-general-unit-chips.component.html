<div class="ecash-unit-chips" role="group" aria-label="Unit">
	@for (chip of chips(); track chip.unit) {
		@if (selectable()) {
			<button
				type="button"
				class="ecash-unit-chip"
				[class.selected]="chip.unit === selected()"
				[attr.aria-pressed]="chip.unit === selected()"
				matRipple
				(click)="select.emit(chip.unit)"
			>
				<ng-container *ngTemplateOutlet="chip_content; context: {$implicit: chip}"></ng-container>
			</button>
		} @else {
			<div class="ecash-unit-chip">
				<ng-container *ngTemplateOutlet="chip_content; context: {$implicit: chip}"></ng-container>
			</div>
		}
	}
</div>

<ng-template #chip_content let-chip>
	<orc-graphic-asset [unit]="chip.unit" [height]="'1.75rem'"></orc-graphic-asset>
	@if (show_unit()) {
		<span>{{ chip.unit | localUnit }}</span>
	} @else {
		<span [innerHTML]="chip.amount ?? 0 | localAmount: chip.unit : 'mint'"></span>
	}
</ng-template>
