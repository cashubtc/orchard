<div>
	<div class="flex flex-justify-between flex-items-center p-b-1">
		<div class="title-l">Mints</div>
		<div class="ecash-mints-add">
			<button matButton type="button" disabled>
				<mat-icon>add</mat-icon>
				<span class="text-nowrap font-size-s">Add mint</span>
			</button>
		</div>
	</div>

	@if (!loading()) {
		<div class="flex flex-column flex-gap-1">
			@for (row of rows(); track row.mint.id) {
				<orc-ecash-general-mint
					animate.enter="orc-animation-fadein"
					[mint]="row.mint"
					[balances]="row.balances"
					[status]="row.status"
					[reserves]="row.reserves"
				></orc-ecash-general-mint>
			}
		</div>
	}
</div>
