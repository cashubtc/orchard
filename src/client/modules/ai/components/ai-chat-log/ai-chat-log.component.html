<div class="ai-chat-log-container">
	<mat-accordion displayMode="flat" class="orc-low-accordion orc-fullscreen-accordion flex-grow">
		<mat-expansion-panel [expanded]="view() === 0" (opened)="setView(0)" (closed)="setView(1)">
			<mat-expansion-panel-header>
				<orc-ai-assistant [assistant]="assistant_definition()"></orc-ai-assistant>
			</mat-expansion-panel-header>
			<div>
				<div class="ai-chat-log-main">
					<orc-ai-assistant-definition [assistant]="assistant_definition()"></orc-ai-assistant-definition>
				</div>
			</div>
		</mat-expansion-panel>
		<div class="p-h-1">
			<div class="category-rule"></div>
		</div>
		<mat-expansion-panel [expanded]="view() === 1" disabled>
			<mat-expansion-panel-header> Chat Log </mat-expansion-panel-header>
			<div class="ai-chat-log-main">
				@for (message of conversation()?.messages; track message.id; let i = $index) {
					@switch (message.role) {
						@case ('SYSTEM') {
							<orc-ai-chat-message-system [message]="message"> </orc-ai-chat-message-system>
						}
						@case ('USER') {
							<orc-ai-chat-message-user [message]="message" [user_name]="user_name()"> </orc-ai-chat-message-user>
						}
						@case ('ASSISTANT') {
							<orc-ai-chat-message-assistant
								[message]="message"
								[revision]="revision()"
								[active_chat]="active_chat()"
								[assistant]="assistant_definition()"
								[index]="i"
								[conversation_length]="conversation()?.messages?.length"
							></orc-ai-chat-message-assistant>
						}
						@case ('ERROR') {
							<orc-ai-chat-message-error [message]="message"> </orc-ai-chat-message-error>
						}
					}
				}
				@if (pending()) {
					<orc-ai-chat-message-pending [assistant]="assistant_definition()" [vendor]="vendor()"></orc-ai-chat-message-pending>
				}
			</div>
		</mat-expansion-panel>
	</mat-accordion>
	<div class="p-h-1">
		<div class="category-rule"></div>
	</div>
	<div class="ai-chat-log-footer">
		<button mat-icon-button type="button" (click)="close.emit()">
			<mat-icon>close</mat-icon>
		</button>
		<button mat-button type="button" (click)="clear.emit()">
			<div class="orc-outline-color font-size-xs">clear conversation</div>
		</button>
	</div>
</div>
