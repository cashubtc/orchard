@if (groups().length) {
	<div class="chart-legend">
		@for (group of groups(); track group.key) {
			@if (group.entries.length > 1) {
				<div class="chart-legend-group">
					<button
						type="button"
						class="chart-legend-group-header"
						[class.chart-legend-entry-hidden]="isGroupHidden(group)"
						(click)="onToggleGroup(group)"
						[title]="group.key"
					>
						{{ group.key }}
					</button>
					@for (entry of group.entries; track entry.index) {
						<button
							type="button"
							class="chart-legend-entry"
							[class.chart-legend-entry-hidden]="isHidden(entry.index)"
							(click)="onToggle(entry)"
						>
							<span
								class="chart-legend-swatch"
								[class.chart-legend-swatch-dashed]="entry.dashed"
								[style.--legend-color]="entry.color"
							></span>
							<span class="chart-legend-label" [title]="entry.label">{{ entry.leaf }}</span>
						</button>
					}
				</div>
			} @else {
				@let entry = group.entries[0];
				<button
					type="button"
					class="chart-legend-entry"
					[class.chart-legend-entry-hidden]="isHidden(entry.index)"
					(click)="onToggle(entry)"
				>
					<span
						class="chart-legend-swatch"
						[class.chart-legend-swatch-dashed]="entry.dashed"
						[style.--legend-color]="entry.color"
					></span>
					<span class="chart-legend-label" [title]="entry.label">{{ entry.label }}</span>
				</button>
			}
		}
	</div>
}
