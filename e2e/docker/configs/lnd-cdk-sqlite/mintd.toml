# cdk-mintd config for Orchard e2e lnd-cdk-sqlite. Regtest only — mnemonic
# is the famous BIP39 test seed, DO NOT reuse in any real deployment.

[info]
url = "http://cdk-mintd:3339"
listen_host = "0.0.0.0"
listen_port = 3339
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
input_fee_ppk = 100

[mint_info]
name = "e2e-cdk"
description = "Orchard e2e lnd-cdk-sqlite"
urls = ["https://cdk-sat-lite.cash"]

[database]
engine = "sqlite"

# cdk-mintd 0.17 made min/max mint+melt bounds required on each [ln] backend
# (the example config shows them commented as optional, but the Ln struct has no
# serde defaults — omitting them fails config parse with "data did not match any
# variant of untagged enum LnOneOrMany"). 0.17 also reworked [ln] into a
# single-or-many enum: keep a single [ln] table here for the one sat backend.
[ln]
ln_backend = "lnd"
unit = "sat"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[lnd]
address = "https://lnd-orchard:10009"
cert_file = "/lnd/tls.cert"
macaroon_file = "/lnd/data/chain/bitcoin/regtest/admin.macaroon"

# cdk-mintd 0.17 added onchain (NUT-30) mint+melt via a BDK backend that talks
# straight to Bitcoin Core RPC — independent of the [ln] lnd backend above, so
# the mint advertises bolt11 (lnd) AND onchain (bdk) at once. Points at the
# same regtest bitcoind the LN nodes use. Regtest only — the mnemonic is a
# throwaway BIP39 test seed (distinct from the mint's info seed). DO NOT reuse.
# NOTE: cdk only registers onchain routes on a fresh DB — adding this to an
# existing stack requires a volume wipe (e2e:down + e2e:up).
[onchain]
onchain_backend = "bdk"
min_mint = 1000
max_mint = 1000000
min_melt = 1000
max_melt = 1000000

[bdk]
mnemonic = "zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo wrong"
network = "regtest"
num_confs = 1
min_receive_amount_sat = 1000
min_send_amount_sat = 546
chain_source_type = "bitcoinrpc"
bitcoind_rpc_host = "bitcoind"
bitcoind_rpc_port = 18443
# Mirrors BTC_RPC_USER / BTC_RPC_PASS from the stack env (regtest polar/polar).
bitcoind_rpc_user = "polar"
bitcoind_rpc_password = "polar"

# Regtest sits at ~1 sat/vB, so shrink the mainnet-tuned safety margins or every
# onchain melt quote massively over-reserves (see cdk example.config.toml notes).
[bdk.batch_config]
quote_fixed_safety_sat = 100
quote_safety_multiplier = 1.10

[mint_management_rpc]
enabled = true
address = "0.0.0.0"
port = 8086
