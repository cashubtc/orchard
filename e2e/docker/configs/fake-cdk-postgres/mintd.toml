# cdk-mintd config for Orchard e2e fake-cdk-postgres. Regtest only — mnemonics
# are public BIP39 test seeds from ../../cdk-regtest.env, DO NOT reuse in any real deployment.
#
# Multi-unit fake_wallet uses one [[payment_backend]] entry per unit.
# Quotes auto-confirm immediately — there is no real LN node.
#
# `ora` is the custom-unit fixture: cdk treats any unrecognised unit string as
# CurrencyUnit::Custom and mints it a keyset like any other. It only settles
# over the onchain method — cdk can't price a custom unit into a bolt11/bolt12
# invoice, so those quotes fail with "Unknown invoice amount". See the ORA
# knobs in activity-fake.sh.

[info]
url = "http://cdk-mintd:3341"
listen_host = "0.0.0.0"
listen_port = 3341
mnemonic = "env:CDK_MINTD_MNEMONIC"
input_fee_ppk = 100

[mint_info]
name = "e2e-cdk-fake"
description = "Orchard e2e fake-cdk-postgres"

[database]
engine = "postgres"

[database.postgres]
url = "env:CDK_MINTD_POSTGRES_URL"
tls_mode = "disable"

[[payment_backend]]
backend = "fakewallet"
unit = "sat"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[[payment_backend]]
backend = "fakewallet"
unit = "usd"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[[payment_backend]]
backend = "fakewallet"
unit = "ora"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
fee_percent = 0.0
reserve_fee_min = 0
min_delay_time = 0
max_delay_time = 0

[mint_management_rpc]
enabled = true
# Plaintext RPC is intentional on the isolated e2e network.
allow_insecure = true
address = "0.0.0.0"
port = 8087
