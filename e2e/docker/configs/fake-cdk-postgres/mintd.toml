# cdk-mintd config for Orchard e2e fake-cdk-postgres. Regtest only — mnemonic
# is the famous BIP39 test seed, DO NOT reuse in any real deployment.
#
# Multi-unit fake_wallet: cdk-mintd 0.17 reworked [ln] into a single-or-many
# enum and dropped [fake_wallet].supported_units — supported units are now
# expressed as one [[ln]] array entry per unit (sat + usd here). Each entry
# also requires min/max mint+melt bounds, else config parse fails with "data
# did not match any variant of untagged enum LnOneOrMany". Delay values are
# zeroed so quotes auto-confirm immediately — there is no real LN node here.

[info]
url = "http://cdk-mintd:3341"
listen_host = "0.0.0.0"
listen_port = 3341
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
input_fee_ppk = 100

[mint_info]
name = "e2e-cdk-fake"
description = "Orchard e2e fake-cdk-postgres"
urls = ["https://cdk-multi-pro.cash"]

[database]
engine = "postgres"

[[ln]]
ln_backend = "fakewallet"
unit = "sat"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[[ln]]
ln_backend = "fakewallet"
unit = "usd"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
fee_percent = 0.0
reserve_fee_min = 0
min_delay_time = 0
max_delay_time = 0

[mint_management_rpc]
enabled = true
address = "0.0.0.0"
port = 8087
